display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.card,.panel{background:linear-gradient(125deg,#162b3480,#101e28da);border:1px solid var(--line);border-radius:11px}.card{padding:18px}.card .value{font-size:29px;display:block;margin:10px 0 7px;letter-spacing:-1px}.positive{color:var(--teal)}.warning{color:var(--amber)}.grid{display:grid;grid-template-columns:minmax(0,1fr) 315px;gap:18px}.panel{padding:19px;min-width:0}.panel h2{font-size:14px;margin:0 0 5px;font-weight:550}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.map{height:435px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,#1c484653,transparent 70%),#0b1c25;border:1px solid var(--line);border-radius:8px}.map svg{width:100%;height:100%;transition:transform .35s}.map .land{fill:#1b353e;stroke:#54707b;stroke-width:1.2}.map text{fill:#69828c;font-size:12px;letter-spacing:3px}.pin{cursor:pointer}.pin:hover circle{stroke:white;stroke-width:3}.map-tools{position:absolute;right:12px;top:12px;display:grid;gap:5px}.map-caption{position:absolute;bottom:15px;left:17px;color:var(--muted);font-size:11px}.factory-row{padding:16px 0;border-bottom:1px solid var(--line);cursor:pointer}.factory-row:hover{color:var(--teal)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.dot{width:6px;height:6px;border-radius:50%;background:var(--teal);display:inline-block;margin-right:7px}.bar{height:5px;border-radius:4px;background:#263b45;margin:11px 0 7px;overflow:hidden}.bar i{display:block;background:var(--teal);height:100%;border-radius:4px}.lower{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:18px;margin-top:18px}.chart{width:100%;height:135px}.chart text{fill:#8a9fa9;font-size:10px}.alarm{padding:12px 0;border-bottom:1px solid var(--line);font-size:12px}.alarm small{display:block;margin:5px 0 0 13px}.lines{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.linecard{cursor:pointer}.linecar const tabs=['Overview','Sustainability','Factory Overview','Facility','Process','Production Overview','Packaging','Quality','Maintenance','Workforce Mgmt','Supply Chain'];const factories=[{name:'Cairo Manufacturing',city:'6th of October',oee:87.4,status:'Operational',x:390,y:125},{name:'Delta Life Sciences',city:'Sadat City',oee:91.2,status:'Operational',x:355,y:95},{name:'Alexandria Biologics',city:'Borg El Arab',oee:82.6,status:'Attention',x:295,y:74},{name:'Suez Pharmaceuticals',city:'Ain Sokhna',oee:89.1,status:'Operational',x:470,y:187}];let state={tab:'Overview',factory:-1,area:'All areas',line:0,zoom:1};const $=s=>document.querySelector(s);function openModal(title,body){$('#modalbody').innerHTML='<h2>'+title+'</h2><p>'+body+'</p>';$('#modal').showModal()}function choose(i){state.factory=i;state.tab='Factory Overview';render()}function card(label,value,detail){return `<div class="card"><small>${label}</small><span class="value">${value}</span><small class="positive">${detail}</small></div>`}function bars(title,labels=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],values=[54,70,62,90,84,96,81]){return `<div class="panel"><h2>${title}</h2><small>${$('#period').value} · simulated performance</small><svg class="chart" viewBox="0 0 320 145">${values.map((v,i)=>`<rect x="${15+i*43}" y="${120-v}" width="23" height="${v}" rx="3" fill="${i===3?'#efb855':'#48b7bb'}"/><text x="${15+i*43}" y="140">${labels[i]||''}</text>`).join('')}</svg></div>`}function donut(label,p){return `<div class="panel" style="text-align:center"><small>${label}</small><div class="donut" style="--p:${p}" data-value="${p}%"></div></div>`}function machine(n){return `<svg class="machine" viewBox="0 0 280 180" aria-label="Isometric production line illustration"><g transform="translate(15 20)"><path d="M0 90 170 145 250 100 80 45Z" fill="#183b48" stroke="#4b7884"/><path d="M20 80 177 127 177 139 20 93Z" fill="#3e7c87"/><path d="M20 80 70 52 224 98 177 127Z" fill="#72aab1"/>${[0,1,2,3,4,5].map(i=>`<path d="M${48+i*23} ${78+i*7} l15 -9 0 -17 -15 8Z" fill="#b4e0df"/><path d="M${48+i*23} ${78+i*7} l-9 -3 0 -17 9 2Z" fill="#417e92"/>`).join('')}<path d="M${n*8+20} 74 l0 -57 30 9 0 56Z" fill="#38778a" stroke="#83ced1"/><path d="M${n*8+25} 25 l20 6 0 20 -20 -6Z" fill="#183b48"/><circle cx="${n*8+34}" cy="38" r="5" fill="#48d8bd"/><path d="M180 108 l0 -63 38 11 0 62Z" fill="#a3c2ca"/><path d="M185 50 l26 8 0 27 -26 -8Z" fill="#245367"/><path d="M175 137v15m-140-58v14m195-4v14" stroke="#6f9ba5" stroke-width="5"/></g></svg>`}function alarms(){return `<div class="panel"><div class="panelhead"><h2>Operational attention</h2><span class="warning">3 active</span></div>${['Packaging line 2 · reject rate elevated','AHU-03 · filter inspection due','Pump P-104 · vibration advisory'].map((x,i)=>`<div class="alarm"><span class="dot" style="background:var(--amber)"></span>${x}<small>${i*7+2} min ago · ${state.factory<0?'Across factories':factories[state.factory].name}</small></div>`).join('')}<button style="margin-top:14px" onclick="openModal('Alarm register','Demo alarms: PKG-002 reject rate 2.4%; AHU-03 filter inspection due; P-104 vibration 4.8 mm/s. No alarms are connected to a live system.')">View alarm register ↗</button></div>`}function overview(){return `<div class="grid"><section class="panel"><div class="panelhead"><div><h2>Factory network</h2><small>Egypt · Select a factory to explore operations</small></div><span class="badge">4 connected demo sites</span></div><div class="map"><svg viewBox="0 0 800 460" role="img" aria-label="Simplified geographic map of Egypt with four selectable factories"><g id="mapgroup" style="transform-origin:400px 220px;transform:scale(${state.zoom})"><path d="M180 48 L300 55 359 80 414 76 476 91 482 131 523 121 565 170 537 216 510 202 487 159 468 191 492 239 531 295 567 373 520 427 180 427Z" class="land"/><path d="M414 76 Q396 105 407 155 T398 230 Q410 270 440 313 T447 427" fill="none" stroke="#3d92a4" stroke-width="4"/><path d="M406 130 382 92 356 78 M406 130 426 86" fill="none" stroke="#3d92a4" stroke-width="2"/><text x="259" y="280">EGYPT</text><text x="510" y="76">SINAI</text><text x="247" y="30">MEDITERRANEAN SEA</text><text x="567" y="305" transform="rotate(55 567 305)">RED SEA</text>${factories.map((f,i)=>`<g class="pin" role="button" tabindex="0" aria-label="Open ${f.name}" onclick="choose(${i})" onkeydown="if(event.key==='Enter')choose(${i})"><circle cx="${f.x}" cy="${f.y}" r="18" fill="${i===2?'#efb855':'#48d8bd'}" opacity=".1"/><circle cx="${f.x}" cy="${f.y}" r="6" fill="${i===2?'#efb855':'#48d8bd'}"/><title>${f.name} — OEE ${f.oee}%</title></g>`).join('')}</g></svg><div class="map-tools"><button aria-label="Zoom in" onclick="zoom(.2)">+</button><button aria-label="Zoom out" onclick="zoom(-.2)">−</button><button onclick="state.zoom=1;render()">⌖</button></div><div class="map-caption">● Operational &nbsp; <span class="warning">● Attention</span> &nbsp; · Simplified map / illustrative site locations</div></div></section><aside class="panel"><div class="panelhead"><h2>Factories</h2><small>OEE</small></div>${factories.map((f,i)=>`<div class="factory-row" role="button" tabindex="0" onclick="choose(${i})" onkeydown="if(event.key==='Enter')choose(${i})"><div class="row"><strong>${f.name}</strong><span>↗</span></div><small>${f.city}</small><div class="bar"><i style="width:${f.oee}%"></i></div><div class="row"><small class="${i===2?'warning':'positive'}">● ${f.status}</small><strong>${f.oee}%</strong></div></div>`).join('')}</aside></div><div class="lower">${bars('Production performance')}${alarms()}<div class="panel"><h2>Network snapshot</h2>${[['Active batches','24'],['Released batches','18'],['Open work orders','12'],['Qualified workforce','96%']].map(x=>`<div class="factory-row row"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}</div></div>`}function production(){return `<div class="twocol"><section class="panel"><div class="panelhead"><div><h2>${state.tab==='Packaging'?'Packaging lines':'Process & production lines'}</h2><small>Select a line to update its performance details</small></div><span class="badge">3 lines</span></div><div class="lines">${[1,2,3].map((n,i)=>`<div class="card linecard ${state.line===i?'selected':''}" onclick="state.line=${i};render()"><div class="row"><strong>LINE ${n}</strong><span class="pill">${i===1?'Changeover':'Running'}</span></div>${machine(n)}<div class="stats">${[['Work order','WO-260'+(41+n)],['Product',['Tablets · 500 mg','Capsules · 250 mg','Sterile vials'][i]],['Target',(120+i*20)+'k units'],['Produced',(96+i*10)+'k units'],['Rejected',(0.8+i*.3)+'%'],['Progress',(80-i*4)+'%']].map(x=>`<div><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div></div>`).join('')}</div></section><section><div class="panel"><div class="panelhead"><h2>Line ${state.line+1} · Performance</h2><span class="positive">● Demo telemetry</span></div>${machine(state.line+1)}<div class="row"><span>Current stage</span><strong>${state.line===1?'Changeover':'Production running'}</strong></div><div class="bar"><i style="width:${80-state.line*4}%"></i></div><button onclick="openModal('Line documentation','Available demo references: user requirements specification, functional specification, operating procedure and equipment manual. Document integration can be configured per factory.')">Documents ↗</button> <button onclick="openModal('Batch '+(26041+state.line),'Status: in progress. Recipe: LS-0'+(state.line+1)+'. Completed stages: preparation and charging. Current stage: processing. This foundation displays simulated operations; equipment commands are not connected.')">Batch details ↗</button></div><div class="metricgrid">${donut('Availability',94-state.line*3)}${donut('Performance',89-state.line*2)}${donut('Quality',98-state.line)}</div></section></div><div class="lower">${bars('Hourly production',['06','08','10','12','14','16','18'])}${bars('Top downtime reasons',['Setup','Feed','Jam','QA','Other'],[32,50,23,37,18])}${alarms()}</div>`}function quality(){return `<div class="quality">${donut('Overall quality',98)}<div class="panel"><h2>Customer satisfaction</h2><div class="donut" style="--p:92" data-value="92%"></div><div class="row"><small>Satisfied 78%</small><small>Neutral 14% · Dissatisfied 8%</small></div></div><div class="panel"><h2>Top product ratings</h2><div class="rating">★★★★★</div><small>Tablets 4.8 · Capsules 4.6 · Vials 4.9</small></div>${donut('Regulatory compliance',96)}${bars('Delivery status',['On time','Late','Pending'],[91,12,25])}<div class="panel"><h2>Consumer complaints</h2><div class="treemap"><div>Product · 12</div><div>Delivery · 7</div><div>Quality · 6</div><div>Support · 4</div></div></div>${bars('Supplier defect rate')}${bars('Cost of poor quality',['Scrap','Rework','Returns','Testing'],[42,63,21,36])}${bars('Top downtime',['CIP','QA hold','Setup','Other'],[65,48,30,19])}</div><div class="lower"><div class="panel"><h2>CIP · Cleaning in place</h2><table><tr><th>Sequence</th><th>Temperature</th><th>Status</th></tr><tr><td>Pre-rinse</td><td>42°C</td><td>Complete</td></tr><tr><td>Caustic wash</td><td>78°C</td><td class="positive">In progress</td></tr><tr><td>Final rinse</td><td>—</td><td>Pending</td></tr></table></div>${bars('PAT · Process quality',['pH','Temp','Moisture','Assay'],[72,83,61,94])}${alarms()}</div>`}function factory(){return `<div class="twocol"><div class="panel"><div class="panelhead"><h2>Factory areas</h2><small>Interactive facility layout · schematic</small></div><div class="layout">${['Facility','Process','Packaging','Quality','Maintenance','Workforce Mgmt'].map((t,i)=>`<button onclick="go('${t}')">${t}<small>${['Utilities & cleanrooms','Batches & process','Lines & output','CIP & PAT','Assets & reliability','People & qualifications'][i]} ↗</small></button>`).join('')}</div></div><div class="panel"><h2>Factory operational status</h2>${[['Production','Running · 8 active batches'],['Quality','98.2% first-pass yield'],['Utilities','Normal operating range'],['Maintenance','3 planned interventions']].map(x=>`<div class="factory-row"><strong>${x[0]}</strong><div class="positive" style="margin-top:8px">${x[1]}</div></div>`).join('')}<button style="margin-top:14px" onclick="openModal('Camera integration','Camera sources can be configured for the main gate, production corridor, packaging and warehouse. No live camera feed is connected in this demonstration.')">Camera sources ↗</button></div></div><div class="lower">${bars('Factory production')}${bars('Energy consumption')}${alarms()}</div>`}const data={Sustainability:{metrics:[['Energy intensity','0.42 kWh/unit'],['Water reuse','68%'],['Carbon emissions','124 tCO₂e'],['Waste recovery','92%']],rows:[['Electricity','418 MWh','−4.2% vs prior period'],['Water','2,640 m³','Within target'],['Steam','162 tonnes','Within target'],['Waste','18 tonnes','92% diverted']]},Facility:{metrics:[['Cleanroom temperature','21.4°C'],['Relative humidity','46%'],['Differential pressure','15 Pa'],['Power demand','1.24 MW']],rows:[['AHU-01','Running','Healthy'],['AHU-03','Running','Filter inspection due'],['Chilled water','6.8°C','Healthy'],['Compressed air','6.2 bar','Healthy']]},Maintenance:{metrics:[['Asset availability','97.8%'],['Open work orders','12'],['Predictive advisories','3'],['MTBF','840 h']],rows:[['Pump P-104','4.8 mm/s','Inspection recommended'],['Motor M-201','62°C','Healthy'],['Compressor C-01','6.2 bar','Healthy'],['Conveyor CV-03','Running','Service scheduled']]},'Workforce Mgmt':{metrics:[['Staff on shift','148'],['Training compliance','96%'],['Qualified technicians','24'],['Open assignments','8']],rows:[['Omar Hassan','Mechanical technician','Pump P-104 qualified'],['Nour Ahmed','Quality analyst','CIP validation qualified'],['Ali Mostafa','Utilities engineer','HVAC qualified'],['Sara Mahmoud','Production supervisor','Batch review qualified']]},'Supply Chain':{metrics:[['On-time delivery','94.6%'],['Inventory coverage','24 days'],['Supplier quality','98.1%'],['Pending shipments','16']],rows:[['API material','320 kg','Available'],['Primary packaging','185k units','Available'],['Finished tablets','96k units','Release pending'],['Cold-chain shipment','2–8°C','In transit']]}};function generic(){let d=data[state.tab];return `<div class="twocol"><div class="panel"><div class="panelhead"><h2>${state.tab==='Maintenance'?'Asset register':state.tab+' overview'}</h2><small>Select a row for details</small></div><table><thead><tr><th>${state.tab==='Workforce Mgmt'?'Person':'Item / system'}</th><th>Reading / role</th><th>Status</th><th></th></tr></thead><tbody>${d.rows.map((r,i)=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td class="${i===1?'warning':'positive'}">${r[2]}</td><td><button onclick="detail(${i})">Inspect ↗</button></td></tr>`).join('')}</tbody></table></div>${alarms()}</div><div class="lower">${bars(state.tab+' performance')}${bars('Target vs actual') }<div class="panel"><h2>Related documents</h2>${['Operating procedure','Inspection checklist','Monthly performance report'].map(x=>`<div class="factory-row"><button onclick="openModal('${x}','Demo document reference for '+state.tab+'. Factory-specific documents and approved links can be configured here.')">${x} ↗</button></div>`).join('')}</div></div>`}function detail(i){let r=data[state.tab].rows[i];openModal(r[0],`Factory: ${state.factory<0?'All factories':factories[state.factory].name}<br>Reading / role: ${r[1]}<br>Status: ${r[2]}<br>${state.tab==='Maintenance'?'Asset location: Process area → Utilities skid. Demo predictive advisory and maintenance history available for configuration.': 'Detailed records shown here are simulated and can be replaced with the factory data source.'}`)}function go(t){state.tab=t;state.area=['Facility','Process','Packaging','Quality','Maintenance','Workforce Mgmt'].includes(t)?t:'All areas';render()}function zoom(d){state.zoom=Math.min(2.2,Math.max(.8,state.zoom+d));render()}function render(){const f=state.factory<0?'All factories':factories[state.factory].name;$('#factory gration endpoints and equipment controls are not connected.</div>'}$('#factory').onchange=e=>{state.factory=+e.target.value;state.tab=state.factory<0?'Overview':'Factory Overview';state.area='All areas';state.line=0;render()};$('#area').onchange=e=>go(e.target.value==='All areas'?'Factory Overview':e.target.value);$('#line').onchange=e=>{state.line=+e.target.value;render()};$('#period').onchange=render;$('#back').onclick=()=>{state={tab:'Overview',factory:-1,area:'All areas',line:0,zoom:1};render()};render();
